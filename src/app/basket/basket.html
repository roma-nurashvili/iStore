<section class="basketPage">
  <div class="basketContainer">
    <div class="basketHeading">
      <h1>Shopping Basket</h1>
      <p>2 items in your basket</p>
    </div>

    <div class="basketContent">
      <div class="basketProducts">
        <article class="basketProduct">
          <img src="/no-image.png" alt="Example product one" />
          <div class="productInfo">
            <h2>Example Product One</h2>
            <p>Brand: Example Brand</p>
            <p>Quantity: 1</p>
          </div>
          <p class="productPrice">$249.99</p>
        </article>

        <article class="basketProduct">
          <img src="/no-image.png" alt="Example product two" />
          <div class="productInfo">
            <h2>Example Product Two</h2>
            <p>Brand: Example Brand</p>
            <p>Quantity: 1</p>
          </div>
          <p class="productPrice">$79.99</p>
        </article>
      </div>

      <aside class="basketSummary">
        <h2>Order Summary</h2>
        <div class="summaryLine">
          <span>Items</span>
          <span>2</span>
        </div>
        <div class="summaryLine">
          <span>Subtotal</span>
          <span>$329.98</span>
        </div>
        <div class="summaryLine total">
          <strong>Total</strong>
          <strong>$329.98</strong>
        </div>
        <a class="continueShopping" href="/products">Continue Shopping</a>
      </aside>
    </div>
  </div>
</section>
