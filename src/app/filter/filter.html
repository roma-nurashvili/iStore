<aside>
  <div class="box">
    <h3>Product Categories</h3>
    <ul>
      <li (click)="selectCategory('all')" [class.active]="activeCategory === 'all'">All Category</li>
      @for (item of categoryData(); track $index) {
        <li (click)="selectCategory(item.name)" [class.active]="activeCategory === item.name">{{item.name | titlecase}}</li>
      }
    </ul>
  </div>
  <div class="box">
    <h3>Product Brands</h3>
    <ul>
      <li (click)="selectBrand('all')" [class.active]="activeBrand === 'all'">All Brands</li>
      @for (item of brandsData(); track $index) {
        <li (click)="selectBrand(item)" [class.active]="activeBrand === item">{{ item | titlecase }}</li>
      }
    </ul>
  </div>
  <div class="box">
    <h3>Product Price</h3>
    <div class="price">
      <label>Price from:</label>
      <input type="number" />
    </div>
    <div class="price">
      <label>Price to:</label>
      <input type="number" />
    </div>
  </div>
  <button>Apply Filter</button>
</aside>
