<aside>
  <div class="box">
    <h3>Product Categories</h3>
    <ul>
      <li (click)="getProducts(1, 12)" [class.active]=" activeCategory() === 'all'">All Category</li>
      @for (item of categoryData(); track $index) {
        <li (click)="filterCategory(1, item.id, item.name)" [class.active]="activeCategory() === item.name">{{item.name | titlecase}}</li>
      }
    </ul>
  </div>
  <div class="box">
    <h3>Product Brands</h3>
    <ul>
      <li (click)="getProducts(1, 12)" [class.active]="activeBrand() === 'all'">All Brands</li>
      @for (item of brandsData(); track $index) {
        <li (click)="filterBrand(1, item)" [class.active]="activeBrand() === item">{{ item | titlecase }}</li>
      }
    </ul>
  </div>
  <div class="box">
    <h3>Product Price</h3>
    <div class="price">
      <label>Price from:</label>
      <input [(ngModel)]="minPrice" type="number" />
    </div>
    <div class="price">
      <label>Price to:</label>
      <input [(ngModel)]="maxPrice" type="number" />
    </div>
  </div>
  <button (click)="filterPrice(minPrice, maxPrice)">Apply Filter</button>
</aside>
