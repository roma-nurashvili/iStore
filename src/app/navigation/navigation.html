<nav>
  <div class="container">
    <div routerLink="/" class="logo">
      <img src="/Tech-Transparent.png" alt="iStore Logo" />
      <span>iStore</span>
    </div>
    <div class="searchTab">
      <input [(ngModel)]="productSearch" type="text" placeholder="What are you looking for?.." />
      <div class="searchBox"></div>
    </div>
    @if (!isAuthenticated()) {
      <ul class="authorization" (click)="signInRequested.emit()">
        <li><i class="fa-solid fa-circle-user"></i></li>
        <li>Sign In</li>
      </ul>
    } @else {
      <div class="accSection">
        <i class="fa-solid fa-cart-shopping"></i>
        <ul class="authorization">
          <li class="avatar"><img [src]="userData()?.avatar" alt=""></li>
            <li>{{userData()?.firstName | uppercase}}</li>
        </ul>
        <i (click)="signOut()" class="fa-solid fa-right-from-bracket"></i>
        <div class="accInfo"></div>
      </div>
    }
  </div>
</nav>
