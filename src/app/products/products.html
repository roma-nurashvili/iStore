<div class="products-layout">
  <app-filter></app-filter>

  <section>
    @for (item of productData(); track $index) {
      <div class="card">
        <img
          [src]="item.thumbnail"
          alt="{{ item.title }}"
          onerror="event.target.src = '/no-image.png'"
        />
        <div class="productInfo">
          <p class="name">{{ item.title }}</p>
          <ul class="price">
            <li class="current">{{ item.price.current | currency }}</li>
            <li
              [style.visibility]="
                item.price.current == item.price.beforeDiscount ? 'hidden' : 'visible'
              "
              class="beforePrice"
            >
              <del>{{ item.price.beforeDiscount | currency }}</del>
            </li>
          </ul>
          <ul class="buttons">
            <li routerLink="/details/{{item._id}}" class="details">View Details</li>
            <li class="addToBasketIcon" (click)="addToBasket(item)">
              <i class="fa-solid fa-cart-shopping"></i>
            </li>
          </ul>
        </div>
      </div>
    }

  </section>

  <ul class="changePage">
    <li (click)="getProducts(activePage -1, 12)" [style.visibility]="activePage === 1 ? 'hidden' : 'visible'"><i class="fa-solid fa-angles-left"></i></li>
    <li (click)="this.getProducts(1, 12)" [class.active]="activePage === 1">1</li>
    <li (click)="this.getProducts(2, 12)" [class.active]="activePage === 2">2</li>
    <li (click)="this.getProducts(3, 12)" [class.active]="activePage === 3">3</li>
    <li (click)="getProducts(activePage +1, 12)" [style.visibility]="activePage === 3 ? 'hidden' : 'visible'"><i class="fa-solid fa-angles-right"></i></li>
  </ul>
</div>
